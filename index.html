<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pomodorocus</title>
  <meta name="description" content="A minimal, installable Pomodoro timer">
  <meta name="theme-color" content="#e74c3c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-512.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <button class="theme-toggle" id="themeToggle" aria-label="Switch theme"></button>

    <h1 class="app-title">Pomodorocus</h1>

    <div class="timer-card">
      <button class="timer-ring-container" id="timerBtn" aria-label="Start or pause timer">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="timer-ring__bg" cx="100" cy="100" r="90" />
          <circle class="timer-ring__progress" id="progressRing" cx="100" cy="100" r="90" />
        </svg>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-indicator" id="timerIndicator">
          <svg class="timer-indicator__icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1" />
            <rect x="14" y="4" width="4" height="16" rx="1" />
          </svg>
          <span class="timer-indicator__label" style="display:none"></span>
        </div>
      </button>

      <div class="session-dots" id="sessionDots"></div>

      <div class="controls">
        <button class="btn btn--primary" id="startPauseBtn">Start</button>
        <button class="btn btn--secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <button class="settings-toggle" id="settingsToggle" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-panel__backdrop" id="settingsBackdrop"></div>
      <div class="settings-panel__content">
        <h2>Settings</h2>
        <label class="setting">
          <span>Focus (min)</span>
          <input type="number" id="workDuration" min="1" max="120" value="25">
        </label>
        <label class="setting">
          <span>Short Break (min)</span>
          <input type="number" id="shortBreakDuration" min="1" max="30" value="5">
        </label>
        <label class="setting">
          <span>Long Break (min)</span>
          <input type="number" id="longBreakDuration" min="1" max="60" value="15">
        </label>
        <label class="setting">
          <span>Sessions before long break</span>
          <input type="number" id="sessionsBeforeLong" min="2" max="10" value="4">
        </label>
        <button class="btn btn--primary settings-save" id="settingsSave">Save</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
  <script>
    kofiWidgetOverlay.draw('ivapo', {
      'type': 'floating-chat',
      'floating-chat.donateButton.text': '',
      'floating-chat.donateButton.background-color': '#f45d22',
      'floating-chat.donateButton.text-color': '#fff'
    });
  </script>
</body>
</html>
